{% extends "base.html" %}

{% block content %}
  <h1 style="font-weight: bold">
    Tags
    <a href="{% url 'todo_app:tag-create' %}" class="btn btn-primary link-to-page">
      Add
    </a>
  </h1>
  {% if tag_list %}
    <table class="table">
      <tr>
        <th>Name</th>
        <th>Update</th>
        <th>Delete</th>
      </tr>

      {% for tag in tag_list %}
        <tr>
          <td>
              {{ tag.name }}
          </td>
          <td>
              <a href="{% url 'todo_app:tag-update' pk=tag.id  %}">
                Update
              </a>
            </td>
            <td>
              <a style="color: red"
                 href="{% url 'todo_app:tag-delete' pk=tag.id %}">
                Delete
              </a>
            </td>
        </tr>
      {% endfor %}
    </table>

  {% else %}
    <p>There are no any tags yet.</p>
  {% endif %}
{% endblock %}
